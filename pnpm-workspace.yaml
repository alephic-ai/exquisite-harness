allowBuilds:
  esbuild: true
  unrs-resolver: true
# The global pnpm config sets minimumReleaseAge (24h supply-chain delay), but
# some @typescript-eslint package metadata is missing the `time` field, which
# makes the check unsatisfiable at resolution time. Exclude just those.
minimumReleaseAgeExclude:
  - '@typescript-eslint/*'
# Force the patched shell-quote (transitive via concurrently, dev-only):
# >=1.8.4 <1.11.0 is affected by GHSA-pqg4-j6r4-53mv (critical, AI-5089),
# fixed in 1.11.0 (earlier: 1.8.4 parse() DoS, CWE-407, fixed in 1.9.0).
# concurrently 10.0.7 pins shell-quote 1.12.0, so this can be removed once
# no other dependency resolves an older shell-quote.
overrides:
  shell-quote: '^1.11.0'
savePrefix: ''
